workflows:
  ios-release:
    name: Build CryptoPortfolio iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: 16.0
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Run iOS unit tests
        script: |
          SIM_NAME=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*//')
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Testing on simulator: $SIM_NAME"
          xcodebuild test \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Build iOS 15-compatible Release Archive
        script: |
          xcodebuild archive \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AppCore.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R AppCore.xcarchive/Products/Applications/AppCore.app Payload/
          zip -qr CryptoPortfolio.ipa Payload
    artifacts:
      - CryptoPortfolio.ipa
