name: Build CryptoPortfolio iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Install Pinned XcodeGen (2.42.0)
        run: |
          XCODEGEN_VER="2.42.0"
          curl -Ls "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VER}/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip
          cd xcodegen && sudo ./install.sh && cd ..
          rm -rf xcodegen xcodegen.zip
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift unit tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7]' | head -n 1 | sed -E 's/^[[:space:]]+//' | sed -E 's/ \([A-F0-9-]+\).*//')
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Running XCTest on: $SIM_NAME"
          xcodebuild test \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Release archive
        run: |
          xcodebuild archive \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AppCore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package and validate IPA
        run: |
          APP="AppCore.xcarchive/Products/Applications/AppCore.app"
          test -d "$APP"
          test -x "$APP/AppCore"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          (cd Payload && zip -qry ../CryptoPortfolio.ipa AppCore.app)
          test -s CryptoPortfolio.ipa
          echo "=== IPA SIZE ==="
          ls -lh CryptoPortfolio.ipa
          du -sh Payload/AppCore.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPortfolio-iOS-IPA
          path: CryptoPortfolio.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.1 CryptoPortfolio.ipa \
            --title "CryptoPortfolio v1.2.1 (iOS 15+ Native IPA)" \
            --notes "CryptoPortfolio 1.2.1 compilado para TrollStore con optimizaciones de memoria, validación de tickers y resiliencia de red." \
            --clobber || true
