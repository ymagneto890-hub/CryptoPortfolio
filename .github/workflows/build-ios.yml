name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Pure Native iOS IPA
        run: |
          xcodebuild -project AppCore.xcodeproj \
            -scheme AppCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AppCore.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          cp AppCore/Icon-60@2x.png AppCore.xcarchive/Products/Applications/AppCore.app/
          cp AppCore/Icon-60@3x.png AppCore.xcarchive/Products/Applications/AppCore.app/

          mkdir -p Payload
          cp -r AppCore.xcarchive/Products/Applications/AppCore.app Payload/
          zip -r CryptoPortfolio.ipa Payload
          ls -lh CryptoPortfolio.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPortfolio-IPA
          path: CryptoPortfolio.ipa
