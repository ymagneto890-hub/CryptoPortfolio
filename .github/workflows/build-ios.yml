name: Build CryptoPortfolio iOS IPA

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Install pinned XcodeGen
        run: |
          XCODEGEN_VER="2.42.0"
          curl -fL --retry 3 "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VER}/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip
          cd xcodegen && sudo ./install.sh && cd ..
          rm -rf xcodegen xcodegen.zip
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift XCTest suite
        run: |
          set -o pipefail
          SIM_NAME=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7]' | head -n 1 | sed -E 's/^[[:space:]]+//' | sed -E 's/ \([A-F0-9-]+\).*//')
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Running XCTest on: $SIM_NAME"
          xcodebuild test \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS 15-compatible Release archive
        run: |
          xcodebuild archive \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AppCore.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP="AppCore.xcarchive/Products/Applications/AppCore.app"
          test -d "$APP"
          test -x "$APP/AppCore"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$DEPLOYMENT_TARGET" = "15.0"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload CryptoPortfolio.ipa
          test -s CryptoPortfolio.ipa
          unzip -t CryptoPortfolio.ipa
          unzip -Z1 CryptoPortfolio.ipa | grep -q '^Payload/AppCore.app/'
          printf 'commit=%s\nref=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > build-info.txt
          shasum -a 256 CryptoPortfolio.ipa | tee ipa-sha256.txt
          echo "Built commit: $GITHUB_SHA"
          echo "Minimum iOS: $DEPLOYMENT_TARGET"
          ls -lh CryptoPortfolio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPortfolio-IPA-${{ github.sha }}
          path: |
            CryptoPortfolio.ipa
            build-info.txt
            ipa-sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish or update tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --verify-tag \
            --title "CryptoPortfolio $TAG" \
            --notes "IPA compilada y probada desde el commit $GITHUB_SHA. SHA-256 incluido en los assets."
          gh release upload "$TAG" CryptoPortfolio.ipa build-info.txt ipa-sha256.txt --clobber
          RELEASE_TAG_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [ "$RELEASE_TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Release tag does not point to the workflow source commit" >&2
            exit 1
          fi
