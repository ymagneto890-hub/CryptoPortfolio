name: Build CryptoPortfolio iOS IPA

on:
  push:
    branches:
      - main
      - master
      - fix/portfolio-reliability-audit
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Swift unit tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7]' | head -n 1 | sed -E 's/^[[:space:]]+//' | sed -E 's/ \([A-F0-9-]+\).*//')
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Running XCTest on: $SIM_NAME"
          xcodebuild test \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Release archive
        run: |
          xcodebuild archive \
            -project AppCore.xcodeproj \
            -scheme AppCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AppCore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package and validate IPA
        run: |
          APP="AppCore.xcarchive/Products/Applications/AppCore.app"
          test -d "$APP"
          test -x "$APP/AppCore"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          (cd Payload && zip -qry ../CryptoPortfolio.ipa AppCore.app)
          test -s CryptoPortfolio.ipa
          echo "=== IPA SIZE ==="
          ls -lh CryptoPortfolio.ipa
          du -sh Payload/AppCore.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPortfolio-iOS-IPA
          path: CryptoPortfolio.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CryptoPortfolio.ipa \
            --title "CryptoPortfolio $GITHUB_REF_NAME — iOS 15+" \
            --notes "Native iOS build. Financial data validation and reliability fixes. Original interface and layout retained." \
            --target "$GITHUB_SHA"
