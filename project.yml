name: CryptoPortfolio
options:
  bundleIdPrefix: com.cryptowidget
targets:
  CryptoPortfolio:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CryptoPortfolio
    info:
      path: CryptoPortfolio/Info.plist
      properties:
        CFBundleDisplayName: Portfolio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowidget.portfolio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
