name: AppCore
options:
  bundleIdPrefix: com.cryptowidget
schemes:
  AppCore:
    build:
      targets:
        AppCore: all
    test:
      config: Debug
      targets:
        - AppCoreTests
    run:
      config: Debug
    archive:
      config: Release
targets:
  AppCore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AppCore
    info:
      path: AppCore/Info.plist
      properties:
        CFBundleDisplayName: Portfolio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "CryptoPortfolio requiere acceso a la red local para sincronizar tus posiciones con tu ordenador."
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-60
            UIPrerenderedIcon: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowidget.portfolio
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: "wholemodule"
          DEAD_CODE_STRIPPING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_STYLE: "all"
          COPY_PHASE_STRIP: "YES"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  AppCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AppCoreTests
    dependencies:
      - target: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowidget.portfolio.tests
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
