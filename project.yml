name: AppCore
options:
  bundleIdPrefix: com.cryptowidget
targets:
  AppCore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AppCore
    info:
      path: AppCore/Info.plist
      properties:
        CFBundleDisplayName: Portfolio
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-60
            UIPrerenderedIcon: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowidget.portfolio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
